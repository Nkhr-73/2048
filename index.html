<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>2048 — シングルファイル実装</title>
  <style>
    :root{
      --bg:#faf8ef; --board:#bbada0; --tile-bg:#cdc1b4; --text:#776e65;
    }
    *{box-sizing:border-box}
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;sans-serif;background:var(--bg);display:flex;align-items:center;justify-content:center;height:100vh;margin:0}
    .container{width:min(520px,95vw)}
    header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    h1{font-size:28px;margin:0;color:#776e65}
    .scoreboard{display:flex;gap:8px}
    .score-box{background:#bbada0;padding:8px 12px;border-radius:6px;color:white;font-weight:700;text-align:center}
    .controls{display:flex;gap:8px;margin-bottom:12px}
    button{background:#8f7a66;border:none;padding:8px 12px;border-radius:6px;color:white;font-weight:700;cursor:pointer}
    .board{background:var(--board);padding:12px;border-radius:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .cell{width:100%;padding-top:100%;position:relative;border-radius:6px;background:var(--tile-bg);}
    .tile{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:28px;color:var(--text)}
    /* tile colors */
    .tile[data-val="0"]{background:transparent}
    .tile[data-val="2"]{background:#eee4da}
    .tile[data-val="4"]{background:#ede0c8}
    .tile[data-val="8"]{background:#f2b179;color:#fff}
    .tile[data-val="16"]{background:#f59563;color:#fff}
    .tile[data-val="32"]{background:#f67c5f;color:#fff}
    .tile[data-val="64"]{background:#f65e3b;color:#fff}
    .tile[data-val="128"]{background:#edcf72;color:#fff;font-size:22px}
    .tile[data-val="256"]{background:#edcc61;color:#fff;font-size:22px}
    .tile[data-val="512"]{background:#edc850;color:#fff;font-size:20px}
    .tile[data-val="1024"]{background:#edc53f;color:#fff;font-size:18px}
    .tile[data-val="2048"]{background:#edc22e;color:#fff;font-size:18px}

    .small{font-size:14px}
    .hint{color:#776e65}
    .overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.8);font-size:28px;color:#776e65}

    @media (max-width:420px){h1{font-size:20px}.tile{font-size:20px}}
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>2048</h1>
      <div class="scoreboard">
        <div class="score-box">Score<br><span id="score">0</span></div>
        <div class="score-box">Best<br><span id="best">0</span></div>
      </div>
    </header>

    <div class="controls">
      <button id="newBtn">New Game</button>
      <div class="hint small">Use arrow keys or swipe. 合体して2048を目指そう！</div>
    </div>

    <div id="boardWrap" style="position:relative">
      <div class="board" id="board"></div>
      <div id="message" class="overlay" style="display:none"></div>
    </div>
  </div>

<script>
(() => {
  const SIZE = 4;
  let grid = [];
  let score = 0;
  const boardEl = document.getElementById('board');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const messageEl = document.getElementById('message');
  const newBtn = document.getElementById('newBtn');

  function init() {
    grid = Array.from({length: SIZE}, () => Array(SIZE).fill(0));
    score = 0;
    loadBest();
    spawnRandom();
    spawnRandom();
    render();
    hideMessage();
  }

  function spawnRandom() {
    const empties = [];
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (!grid[r][c]) empties.push([r,c]);
    if (!empties.length) return false;
    const [r,c] = empties[Math.floor(Math.random()*empties.length)];
    grid[r][c] = Math.random()<0.9?2:4;
    return true;
  }

  function render() {
    boardEl.innerHTML = '';
    for (let r=0;r<SIZE;r++){
      for (let c=0;c<SIZE;c++){
        const cell = document.createElement('div');
        cell.className = 'cell';
        const tile = document.createElement('div');
        tile.className = 'tile';
        const val = grid[r][c];
        tile.dataset.val = val;
        tile.textContent = val?val:'';
        cell.appendChild(tile);
        boardEl.appendChild(cell);
      }
    }
    scoreEl.textContent = score;
    updateBest();
  }

  function copyGrid(g){return g.map(row=>row.slice())}

  function rotateClockwise(g){
    const N = g.length;
    const res = Array.from({length:N}, ()=>Array(N).fill(0));
    for(let r=0;r<N;r++) for(let c=0;c<N;c++) res[c][N-1-r]=g[r][c];
    return res;
  }

  function moveLeft(g){
    let moved=false; let gained=0;
    const N = g.length;
    const out = Array.from({length:N}, ()=>Array(N).fill(0));
    for (let r=0;r<N;r++){
      let pos=0;
      for (let c=0;c<N;c++){
        if (!g[r][c]) continue;
        let cur = g[r][c];
        // try to merge with last placed
        if (out[r][pos]===0){
          out[r][pos]=cur;
          if (c!==pos) moved=true;
        } else if (out[r][pos]===cur){
          out[r][pos]=cur*2;
          gained += cur*2;
          score += cur*2;
          pos++;
          moved=true;
        } else {
          pos++;
          out[r][pos]=cur;
          if (c!==pos) moved=true;
        }
      }
    }
    return {moved,out,gained};
  }

  function canMove(g){
    // check empty
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE;c++) if (g[r][c]===0) return true;
    // check merges
    for (let r=0;r<SIZE;r++) for (let c=0;c<SIZE-1;c++) if (g[r][c]===g[r][c+1]) return true;
    for (let c=0;c<SIZE;c++) for (let r=0;r<SIZE-1;r++) if (g[r][c]===g[r+1][c]) return true;
    return false;
  }

  function move(direction){
    // 0:left, 1:up, 2:right, 3:down
    let g = copyGrid(grid);
    let rotated = g;
    // rotate so that moveLeft can handle
    for (let i=0;i<direction;i++) rotated = rotateClockwise(rotated);
    const res = moveLeft(rotated);
    if (!res.moved) return false;
    // rotate back
    let out = res.out;
    for (let i=0;i<(4-direction)%4;i++) out = rotateClockwise(out);
    grid = out;
    // after move add a tile
    spawnRandom();
    render();
    if (!canMove(grid)) showMessage('Game Over');
    if (score>getBest()) setBest(score);
    return true;
  }

  function showMessage(text){
    messageEl.style.display='flex';
    messageEl.textContent=text + ' — Restart?';
  }
  function hideMessage(){messageEl.style.display='none'}

  function getBest(){return Number(localStorage.getItem('2048_best')||0)}
  function setBest(v){localStorage.setItem('2048_best',String(v)); updateBest()}
  function updateBest(){bestEl.textContent = getBest()}
  function loadBest(){updateBest()}

  // keyboard controls
  window.addEventListener('keydown', e=>{
    if (messageEl.style.display==='flex') return;
    let moved=false;
    if (e.key==='ArrowLeft') moved = move(0);
    else if (e.key==='ArrowUp') moved = move(3);
    else if (e.key==='ArrowRight') moved = move(2);
    else if (e.key==='ArrowDown') moved = move(1);
    if (moved) e.preventDefault();
  });

  // touch swipe
  let startX, startY, distX, distY;
  const threshold = 30;
  boardEl.addEventListener('touchstart', e=>{
    const t = e.touches[0]; startX=t.clientX; startY=t.clientY; distX=0; distY=0;
  }, {passive:true});
  boardEl.addEventListener('touchmove', e=>{ const t=e.touches[0]; distX=t.clientX-startX; distY=t.clientY-startY; }, {passive:true});
  boardEl.addEventListener('touchend', e=>{
    if (messageEl.style.display==='flex') return;
    if (Math.abs(distX) < threshold && Math.abs(distY) < threshold) return;
    if (Math.abs(distX) > Math.abs(distY)){
      if (distX>0) move(2); else move(0);
    } else {
      if (distY>0) move(3); else move(1);
    }
  });

  // new game
  newBtn.addEventListener('click', ()=>{ init(); });
  messageEl.addEventListener('click', ()=>{ init(); });

  // init first
  init();
})();
</script>
</body>
</html>
