<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>2048風ゲーム</title>
  <style>
    body { font-family: Arial; text-align: center; }
    #game { display: inline-block; margin-top: 30px; }
    .row { display: flex; }
    .cell {
      width: 60px; height: 60px; margin: 4px;
      background: #ccc; font-size: 24px; line-height: 60px;
      text-align: center; border-radius: 8px;
    }
    #authArea { margin-bottom: 12px; }
  </style>
</head>
<body>
  <h1>2048風ゲーム</h1>
  <!-- ログインフォーム -->
  <div id="authArea">
    <input type="email" id="email" placeholder="メールアドレス">
    <input type="password" id="password" placeholder="パスワード">
    <button id="loginBtn">ログイン</button>
    <span id="userInfo"></span>
  </div>
  <div id="game"></div>
  <button id="retryBtn" style="display:none;">もう一度遊ぶ</button>
  <p>矢印キーで操作</p>
  <script>
    // 事前に決めるメールとパスワード
    const fixedEmail = "your@example.com";      // ここを好きなアドレスに
    const fixedPassword = "yourpassword";       // ここを好きなパスワードに
    let loggedIn = false;

    document.getElementById('loginBtn').onclick = function() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('password').value;
      if(email === fixedEmail && pass === fixedPassword) {
        loggedIn = true;
        document.getElementById('userInfo').textContent = "ログイン中: " + email;
        document.getElementById('email').style.display = "none";
        document.getElementById('password').style.display = "none";
        document.getElementById('loginBtn').style.display = "none";
        document.getElementById('game').style.pointerEvents = "auto";
        document.getElementById('retryBtn').disabled = false;
      } else {
        alert("メールアドレスまたはパスワードが正しくありません");
      }
    };

    // ゲーム本体
    const size = 4;
    let board = Array(size).fill().map(() => Array(size).fill(0));
    let score = 0;
    let highScore = localStorage.getItem('2048_highscore') || 0;
    let gameOver = false;

    function updateHighScore() {
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('2048_highscore', highScore);
      }
    }

    function addRandom() {
      let empty = [];
      for (let r = 0; r < size; r++)
        for (let c = 0; c < size; c++)
          if (board[r][c] === 0) empty.push([r, c]);
      if (empty.length === 0) return;
      let [r, c] = empty[Math.floor(Math.random() * empty.length)];
      board[r][c] = Math.random() < 0.9 ? 2 : 4;
    }

    function draw() {
      let html = `<div>スコア: ${score}　ハイスコア: ${highScore}</div>`;
      for (let r = 0; r < size; r++) {
        html += '<div class="row">';
        for (let c = 0; c < size; c++) {
          html += `<div class="cell">${board[r][c] || ""}</div>`;
        }
        html += '</div>';
      }
      document.getElementById('game').innerHTML = html;
      document.getElementById('retryBtn').style.display = gameOver ? "inline-block" : "none";
      // ログイン前はゲーム不可
      document.getElementById('game').style.pointerEvents = loggedIn ? "auto" : "none";
      document.getElementById('retryBtn').disabled = !loggedIn;
    }

    function slide(row) {
      let newRow = row.filter(x => x);
      for (let i = 0; i < newRow.length - 1; i++) {
        if (newRow[i] === newRow[i+1]) {
          newRow[i] *= 2;
          score += newRow[i];
          newRow[i+1] = 0;
        }
      }
      newRow = newRow.filter(x => x);
      return newRow.concat(Array(size - newRow.length).fill(0));
    }

    function rotateLeft(matrix) {
      return matrix[0].map((_, i) => matrix.map(row => row[size - 1 - i]));
    }

    function handleMove(direction) {
      if (gameOver || !loggedIn) return;
      let old = JSON.stringify(board);
      for (let i = 0; i < direction; i++) board = rotateLeft(board);
      for (let r = 0; r < size; r++) board[r] = slide(board[r]);
      for (let i = 0; i < (4 - direction) % 4; i++) board = rotateLeft(board);
      if (JSON.stringify(board) !== old) addRandom();
      draw();
      updateHighScore();
      if (!canMove()) {
        gameOver = true;
        draw();
        alert("ゲームオーバー！");
      }
    }

    function canMove() {
      for (let r = 0; r < size; r++)
        for (let c = 0; c < size; c++) {
          if (board[r][c] === 0) return true;
          if (r < size-1 && board[r][c] === board[r+1][c]) return true;
          if (c < size-1 && board[r][c] === board[r][c+1]) return true;
        }
      return false;
    }

    document.addEventListener('keydown', e => {
      if (!loggedIn) return;
      if (e.key === "ArrowLeft") handleMove(0);
      if (e.key === "ArrowUp") handleMove(1);
      if (e.key === "ArrowRight") handleMove(2);
      if (e.key === "ArrowDown") handleMove(3);
    });

    document.getElementById('retryBtn').onclick = function() {
      if (!loggedIn) return;
      newGame();
    };

    function newGame() {
      board = Array(size).fill().map(() => Array(size).fill(0));
      score = 0;
      gameOver = false;
      addRandom(); addRandom();
      draw();
    }

    newGame();
  </script>
</body>
